services:
  - type: web
    name: maildoctor
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn maildoctor.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MAILDOCTOR_LLM
        value: auto
      - key: MAILDOCTOR_DNS
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
