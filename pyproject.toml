[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maildoctor"
version = "0.1.0"
description = "Agentic AI that diagnoses and fixes domain, DNS, email-auth, email-client and hosting problems."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "dnspython>=2.6",
  "httpx>=0.27",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
maildoctor = "maildoctor.cli:main"

[tool.setuptools.packages.find]
include = ["maildoctor*"]

[tool.setuptools.package-data]
maildoctor = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
